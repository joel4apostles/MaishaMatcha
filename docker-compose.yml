# Local Postgres for development and tests: the same engine and major
# version as Supabase. Start with `npm run db:up`; data persists in a volume.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maisha
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - maisha-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  maisha-db:
