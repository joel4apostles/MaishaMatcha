name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same engine and major version as Supabase. Each test run creates
      # and drops its own database on this server.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        # On failure, surface npm's debug log directly in the step output.
        run: npm ci || { tail -n 60 /home/runner/.npm/_logs/*-debug-0.log; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        # Unit tests plus Payload integration tests on a throwaway Postgres
        # database, migrated with the committed migrations.
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build
        run: npm run build
        env:
          # Public origin only — no secrets needed; the waitlist degrades
          # gracefully without Resend env at runtime.
          NEXT_PUBLIC_SITE_URL: https://maishamatcha.es
