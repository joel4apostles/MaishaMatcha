name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # On failure, surface npm's debug log directly in the step output.
        run: npm ci || { tail -n 60 /home/runner/.npm/_logs/*-debug-0.log; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Public origin only — no secrets needed; the waitlist degrades
          # gracefully without Resend env at runtime.
          NEXT_PUBLIC_SITE_URL: https://maishamatcha.es
